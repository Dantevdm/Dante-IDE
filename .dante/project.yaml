name: Dante IDE
summary: A native macOS IDE where Claude and Codex work beside you, and Dante shows you the whole system they're working on.

# Design canvas: https://claude.ai/artifact/KFxwBAj14jL7w1MHNcc5Pi

claude:
  propose: [Sources/, Tests/, design/, scripts/, .dante/, README.md, CLAUDE.md]
  flag: [Package.swift, Package.resolved, .gitignore]
  never: [".env*", "*.pem", "*.p12", "*.mobileprovision"]
