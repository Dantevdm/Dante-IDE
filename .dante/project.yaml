name: Dante IDE
summary: A native macOS IDE organised around the whole software lifecycle, with Claude as a pair.

lifecycle:
  template: app@1
  current: build

# Milestone 1: app shell + editor (window, launch, themes, explorer, tabs, editor, terminal).
# Design canvas: https://claude.ai/artifact/KFxwBAj14jL7w1MHNcc5Pi

claude:
  propose: [Sources/, Tests/, design/, scripts/, .dante/, README.md, CLAUDE.md]
  flag: [Package.swift, Package.resolved, .gitignore]
  never: [".env*", "*.pem", "*.p12", "*.mobileprovision"]
