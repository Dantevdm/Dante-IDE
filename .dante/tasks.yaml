- id: DI-99
  title: "Remote projects over SSH (scope first; may stay a plan)"
  phase: build
  state: review
  spec: docs/plans/remote-ssh.md
  notes: "Built as a local mirror synced with rsync, with commands, Claude Code, the terminal and language servers on the host; Docker and Data run there too, with service ports forwarded here, and Claude history, Timeline and usage read the host's transcripts. Not tested against a real ssh host yet; password auth is out of scope."
- id: DI-100
  title: "Breakpoints follow edits"
  phase: build
  state: review
  notes: "BreakpointShift maps each edit: lines below move with added or removed newlines, a line deleted whole loses its breakpoint. Only the focused pane reports edits, so a split on one file doesn't move them twice. A running program isn't told."
- id: DI-101
  title: "Walk and work: jobs on the Mac, away mode, and an iPhone and iPad companion"
  phase: build
  state: wip
  spec: docs/plans/walk-and-work.md
  notes: "Step 1 is in: jobs run side by side, each with its own agent in a worktree on a dante/ branch, with a Jobs board, a switcher and inbox in the panel, merge and discard, and pausing and resuming across restarts. Step 2 is in: JobGuard keeps every job off pushes, merges, branch moves, publishing and deploys, away mode with a time budget approves edits, builds, tests and local commits, and `dante job` hands a job over from the terminal (links from elsewhere are confirmed). Step 3 is in: job types in .dante/jobs/ (Builder takes a task; Pipeline watcher starts when CI fails on your branch, watched by Dante with gh, opt-in per Mac), with scope and commands per type, a Job types card and `dante job --type`. Next: DanteCore and the companion server (step 4)."
