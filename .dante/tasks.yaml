- id: DI-131
  title: "Automatic task routing: effort per request for Codex, self-contained rewrites and summaries answered by a small local model with the agent as fallback"
  phase: build
  state: review
  notes: "TaskRouting.classify runs on the Mac (no tokens): risky words make a request complex, a few routine openings make it routine, everything else is standard. Codex gets low or medium effort; Claude keeps its chosen model. A `summarise this: …` style request goes to the smallest suitable Ollama model with a 30 s timeout and falls back to the agent. On by default (Settings › Agents, or Automatic by task in Codex's model menu). Each decision is a note in the conversation."
