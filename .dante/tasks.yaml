- id: DI-120
  title: "Security layer: scan the project (secrets, dependencies, code, config, containers, infra), explain and rank findings, suggest and apply fixes through Claude or Codex, and keep watching on every change"
  phase: build
  state: review
  notes: "Security area: Dante's scanner (secrets, POPIA personal information, encryption, injection, containers, CI, infrastructure), installed scanners, OSV.dev when checking online, a grade, accepted risks in .dante/security.yaml, fixes by the agent in charge with the other checking, deep audits, edit review before approval, and dante scan for CI."
- id: DI-121
  title: "Search by meaning: a local embedding model indexes the project, the Search panel answers plain questions, and Claude and Codex get search_code"
  phase: build
  state: review
  notes: "SemanticIndex cuts files at top-level declarations (Chunker), embeds them with an embedding model in Ollama (qwen3-embedding first), keeps vectors per Mac in Application Support and re-embeds only changed pieces. The first index of Dante's 330 files takes about 3.5 minutes (the model's speed), later updates half a second; it saves progress as it goes, main code first. dante search for the terminal."
- id: DI-122
  title: "Looker: a local vision model reads screenshots and images for Claude and Codex (look tool) and from the image viewer"
  phase: build
  state: review
  notes: "Only models that read UI reliably are used (Qwen-VL, Gemma 3, Mistral Small 3, MiniCPM-V) and only if they fit in 60% of memory; llava, granite-vision and llama3.2-vision invent details or no longer load, so they're skipped with a reason. qwen3-vl:8b is installed and reads Dante's own screens accurately (about 50 s for a full description on an M4 Pro); answers render as markdown."
- id: DI-123
  title: "Motion studio: videos, decks and explainers made by the agents from the real system, in the brand, narrated, rendered to 4K"
  phase: build
  state: review
  notes: "Pieces in docs/motion/<name>/, scenes drawn from seek(t), three.js, hairline and Open Peeps bundled with an import map, a frame clock for libraries in renders, four-step New piece sheet (idea, live gallery of twenty styles and illustration kits, the brief, Claude, Codex or both). The player switches between and compares two makers' versions and adopts one, shows lint and the other agent's critique (contact sheet, read-only, notes sent back to the maker), exports a one-file web page and a PDF of slides or storyboard, and presents decks on the Stage (keys, clicker, voice)."
- id: DI-124
  title: "Agent HQ: the agents as people in an isometric office around a glowing brain, with a task board and team panel (the design canvas's Office board)"
  phase: build
  state: review
  notes: "Built as Agents › HQ: AgentOffice (DanteKit) grows rooms, eras, grounds and milestones from the ledger and git history; MotionLib/hq/office.html draws it in WebKit with live workers from every conversation, a replay and celebrations. The menu bar panel shows a pocket HQ under the Vine D. The Stage shows it too. Still to do: hiring a role as a job type."
